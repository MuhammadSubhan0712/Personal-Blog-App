<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blogging App</title>


    <!-- Tailwind CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet" />

    <!-- Daisyui CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@1.14.0/dist/full.css"
      rel="stylesheet" />
  </head>


  <body class="relative bg-base-300 flex flex-col items-center min-h-screen">

    <!-- Navbar -->
    <div class="bg-primary text-white w-full h-12 p-3 flex justify-between items-center shadow-lg">
        <a class="text-2xl font-extrabold tracking-wide">Personal Blogging App</a>

        <button id="logout-btn" class="bg-white text-primary font-semibold px-4 py-1 rounded-md transition duration-300 hover:bg-gray-200">
            <a href="./login.html">Login</a>
        </button>
    </div>

    <!-- Heading -->
    <h1 class="text-5xl text-center font-extrabold bg-white w-full p-4 mt-6 shadow-md">
        Good Morning, Readers! ☀️
    </h1>

    <!-- Blog Section -->
    <main id="main" class="container mt-12 flex flex-col w-full max-w-3xl bg-white text-black gap-8 justify-center mx-auto px-10 py-10 shadow-lg rounded-xl">
        <!-- Blog content will be rendered here -->
    </main>

 
    <!-- ------------------------------------------------------------- -->

    <script type="module" src="app.js"></script>
  </body>
</html>
