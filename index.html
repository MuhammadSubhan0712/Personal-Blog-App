<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blogging App</title>

    <!-- Tailwind CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet" />
    


    <!-- Daisyui CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@1.14.0/dist/full.css"
      rel="stylesheet" />
  </head>

  <body class="relative bg-base-300 flex flex-col items-center min-h-screen">
    <!-- Navbar -->
    <div
      class="bg-primary text-white w-full h-12 p-3 flex justify-between items-center shadow-lg">
      <a class="text-2xl font-extrabold tracking-wide">Personal Blogging App</a>

      <button
        class="bg-white text-xl text-primary font-semibold px-4 py-1 rounded-md transition duration-300 hover:bg-gray-200">
        <a href="./login.html">Login</a>
      </button>
    </div>

    <!-- Heading -->
    <h1
      class="text-5xl text-center font-extrabold bg-white w-full p-4 mt-6 shadow-md">
      Good Morning, Readers! ☀️
    </h1>

    <!-- Blog Section -->
    <main
      id="main"
      class="mx-auto w-full max-w-4xl px-4 sm:mx-6 lg:px-8 md:py-12 space-y-8 md:space-y-12">
      <!-- Blog content will be rendered here -->
    </main>

    <!-- ------------------------------------------------------------- -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->

    <script type="module" src="app.js"></script>
  </body>
</html>
