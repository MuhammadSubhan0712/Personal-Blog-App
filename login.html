<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>

    <!-- Tailwind CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet" />

    <!-- Daisyui CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@1.14.0/dist/full.css"
      rel="stylesheet" />
  </head>

  <body class="bg-base-300 flex flex-col min-h-screen">
    <!-- Navbar -->
    <div
      class="bg-primary text-white w-full h-15 p-3 flex justify-between items-center shadow-lg">
      <a href="./index.html" class="text-2xl font-extrabold tracking-wide"
        >Personal Blogging App</a
      >

      <button
        class="bg-white text-xl text-primary font-semibold px-4 py-1 rounded-md transition duration-300 hover:bg-gray-200">
        <a href="./register.html">Sign Up</a>
      </button>
    </div>

    <!-- Heading -->
    <h1
      class="text-5xl text-center font-extrabold bg-white w-full p-4 mt-6 shadow-md">
      Login 🔑
    </h1>

    <!-- Login Form Section -->
    <div class="flex items-center justify-center mt-10 w-full px-4 ">
      <div class="w-full max-w-sm">
        <form id="form" class="bg-white shadow-xl rounded-lg px-8 pt-8 pb-10">
          <!-- Email Input -->
          <div class="mb-4">
            <input
              id="email"
              type="email"
              class="input input-bordered w-full p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
              placeholder="Enter your Email"
              required />
          </div>

          <!-- Password Input -->
          <div class="mb-6">
            <input
              id="password"
              type="password"
              class="input input-bordered w-full p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
              placeholder="Enter your Password"
              required />
          </div>

          <!-- Login Button -->
          <div class="flex items-center justify-center">
            <button
              type="submit"
              class="btn btn-primary w-full py-3 rounded-lg text-lg font-semibold transition duration-300 hover:bg-opacity-90">
              Login
            </button>
          </div>
        </form>
      </div>
    </div>
    <!-- ------------------------------------------------------------- -->

    <!-- Script tag -->

    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="login.js"></script>
  </body>
</html>
