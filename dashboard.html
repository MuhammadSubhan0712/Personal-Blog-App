<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>


    <!-- Tailwind CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet" />

    <!-- Daisyui CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@1.14.0/dist/full.css"
      rel="stylesheet" />
  </head>


  <body class="relative flex flex-col items-center min-h-screen bg-base-300">

    <!-- Navbar -->
    <div class="bg-primary text-white w-full h-12 p-3 flex justify-between items-center shadow-lg">
        <a href="./index.html" class="text-2xl font-extrabold tracking-wide">Personal Blogging App</a>

        <button id="logout-btn" class="bg-white text-primary font-semibold px-4 py-1 rounded-md transition duration-300 hover:bg-gray-200">
            Logout
        </button>
    </div>

    <!-- Dashboard Heading -->
    <h1 class="text-5xl text-center font-extrabold bg-white w-full p-4 mt-6 shadow-md">
        Dashboard 📋
    </h1>

    <!-- Dashboard Form -->
    <div class="w-full max-w-lg mt-8 px-4">
        <form id="form" class="bg-white mb-5 shadow-2xl rounded-lg px-8 pt-8 pb-10">
            
            <!-- Placeholder -->
            <div class="mb-4">
                <input id="placeholder" type="text"
                    class="input input-bordered w-full p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary" 
                    placeholder="Title of your blog" />
            </div>

            <!-- Blog Content -->
            <div class="mb-4">
                <textarea id="blog" name="blog"
                    class="textarea textarea-bordered w-full p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary" 
                    placeholder="What’s on your mind?"></textarea>
            </div>

            <!-- Publish Button -->
            <div class="flex justify-center">
                <button type="submit" class="btn btn-primary w-full py-3 rounded-lg text-lg font-semibold transition duration-300 hover:bg-opacity-90">
                    Publish Blog 🚀
                </button>
            </div>
        </form>
    </div>

   <!-- Blog Render Section -->
<div class="w-full max-w-lg mt-10 text-center">
  <h2 class="text-3xl font-bold text-primary bg-white p-4 rounded-md shadow-md">
      Your Blogs 📝
  </h2>
</div>

<!-- Blog Container -->
<main id="main" class="container mt-6 flex flex-col max-w-lg w-full bg-white text-black gap-6 justify-center mx-auto py-8 px-6 shadow-md rounded-lg">
  <!-- Blogs will be dynamically rendered here -->
</main>

 
    <!-- ------------------------------------------------------------- -->

    <script type="module" src="dashboard.js"></script>
  </body>
</html>
